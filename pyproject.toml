[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-rag-assistant"
version = "0.1.0"
description = "Domain-specific RAG assistant for AI/ML and NLP arXiv papers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hieu Dinh" }]
dependencies = [
  "faiss-cpu>=1.8",
  "fastapi>=0.115",
  "httpx>=0.27",
  "kagglehub>=0.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "streamlit>=1.32",
  "tqdm>=4.66",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "nbformat>=5.10",
  "nbclient>=0.10",
]

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "scripts", "app", "tests"]
exclude = [".venv", "data", "indexes", "uploads", ".cache", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"scripts/**" = ["E402"]
